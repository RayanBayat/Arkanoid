name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build runnable JAR
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          ./mvnw --batch-mode --no-transfer-progress -Drevision="$VERSION" clean verify
      - name: Create self-contained application
        shell: bash
        run: >-
          jpackage --type app-image --name Arkanoid-Resonance
          --input target --main-jar arkanoid-resonance.jar
          --main-class Arkanoid.Arkanoid --dest target/package
      - name: Archive application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/package/Arkanoid-Resonance -DestinationPath target/Arkanoid-Resonance-${{ matrix.platform }}.zip
      - name: Archive application (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target/package -czf target/Arkanoid-Resonance-${{ matrix.platform }}.tar.gz Arkanoid-Resonance.app 2>/dev/null || tar -C target/package -czf target/Arkanoid-Resonance-${{ matrix.platform }}.tar.gz Arkanoid-Resonance
      - uses: actions/upload-artifact@v4
        with:
          name: Arkanoid-Resonance-${{ matrix.platform }}
          path: target/Arkanoid-Resonance-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
